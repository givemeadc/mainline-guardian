[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mainline-guardian"
version = "0.3.0"
description = "A lightweight control layer that keeps AI work aligned with the user's real outcome."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "givemeadc" }]
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]

[project.scripts]
mainline-guardian = "mainline_guardian.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
mainline_guardian = ["py.typed", "goal_guard.py"]

